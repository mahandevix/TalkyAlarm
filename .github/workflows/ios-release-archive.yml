name: iOS Release Archive

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-archive:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Release archive
        env:
          ARCHIVE_PATH: ${{ github.workspace }}/build/TalkyAlarm.xcarchive
        run: ./scripts/ci/ios-release-archive.sh

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalkyAlarm-release-archive
          path: build/TalkyAlarm.xcarchive
          if-no-files-found: error
